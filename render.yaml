services:
  - type: web
    name: driftwatch-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh scripts/start-production.sh
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUN_MODE
        value: all
      - key: AUTO_SEED_DEMO
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: OPERATOR_TOKEN
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: RETENTION_DAYS
        value: "7"
      - key: RETENTION_MAX_ROWS
        value: "25000"
      - key: RATE_LIMIT_MAX
        value: "60"
